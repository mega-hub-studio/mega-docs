# golangci-lint for this repo. Derived from .claude/skills/golang-lint/assets/.golangci.yml,
# with every deviation stated — a config nobody can explain is a config people disable.
#
# The rule this file exists to protect: `make lint` says nothing unless something is
# actually wrong. The stock config reported 591 issues here, 420 of them whitespace and
# missing t.Parallel(). A gate that always shouts is a gate everybody learns to ignore.
#
# The version is pinned — GOLANGCI_VERSION in the Makefile, which CI reads too — so this
# file has exactly one binary to be correct against. That is what lets `modernize` be
# enabled below and the whole "considered and rejected" list be *comments* rather than
# `disable:` keys: an unknown linter name is a hard error, so a name written down is a
# tripwire on every upgrade, and a name that disables nothing is a tripwire for free.
version: "2"

run:
  # sqlite-vec and FTS5 are cgo behind a build tag. Without it the linter analyses a
  # tree that does not compile and reports nonsense.
  build-tags:
    - sqlite_fts5
  tests: true

issues:
  # Both unlimited. The tree is at zero, so the only reason to see a truncated report is
  # if truncation is hiding the second half of a regression.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  # `none`, not the default `standard`. The list below is then the *complete* set — no
  # union with a five-name default you have to look up, and no linter arriving behind your
  # back on an upgrade to shout at a tree that was green. The five `standard` ones
  # (errcheck, govet, ineffassign, staticcheck, unused) are all named here explicitly.
  default: none

  enable:
    # correctness
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - copyloopvar
    - durationcheck
    - reassign
    # style
    - gocritic
    - revive
    - whitespace
    - godot
    - misspell
    - dupword
    - predeclared
    - errname
    - asciicheck
    # godox: a TODO is debt with no owner and no date, and this tree has none — enabling it
    # at zero costs nothing today and is the only machine check CLAUDE.md rule 24 can have.
    # What a TODO was for goes in changelog/ (dated, with the decision) or is done now.
    - godox
    # complexity
    - gocyclo
    - nestif
    - funlen
    # performance
    - perfsprint
    - unconvert
    - ineffassign
    - goconst
    # security & resources
    - gosec
    - bidichk
    - bodyclose
    - containedctx
    - fatcontext
    - sqlclosecheck
    - rowserrcheck
    # modernisation
    - intrange
    - usestdlibvars
    - exhaustive
    - nolintlint
    # modernize needs golangci-lint >= 2.9, which the pin guarantees. It found two real
    # simplifications when first run (strings.Cut, slices.Contains), both applied.
    - modernize
    # tests
    - thelper
    - usetesting

  # ── Considered and rejected ───────────────────────────────────────────────────
  # Comments, not `disable:` keys: with `default: none` nothing here is enabled, so
  # disabling it would be a no-op that still breaks the config the day the name is
  # retired upstream. The reason is the part worth keeping.
  #
  #   wsl_v5        304 findings, all "put a blank line here". This repo's comments carry
  #                 the structure instead, and its style is set by the surrounding code.
  #   paralleltest  116 findings. Every test owns a real SQLite file or an httptest
  #                 provider; the suite runs in under a second, so parallelism would buy
  #                 nothing and make a failure harder to read.
  #   dupl          test setup repeats on purpose — a test that shares a fixture with
  #                 another test fails for reasons that are not in it.
  #   noctx         33 findings, all database/sql calls in internal/db that could take a
  #                 Context. Deliberately not threaded through: every query here is a
  #                 local SQLite read measured in microseconds, the cancellable work is
  #                 the provider call (which does take ctx), and the change would touch
  #                 every method of the store for no measurable gain. Turn this on the day
  #                 a query gets slow enough to want cancelling, or the store stops being
  #                 a local file.
  #   sloglint · loggercheck · testifylint · exptostd
  #                 no slog, no testify, no golang.org/x/exp. Nothing to check.
  #
  # Everything else the recommended config ships is off for the reasons that config
  # already gives; re-read it there rather than copying the list to a second home.

  settings:
    errcheck:
      check-type-assertions: true
      # A failed Close on a read path, or a Rollback after a successful Commit, has
      # nothing a caller can do about it. Every *other* ignored error is written as
      # `_ =` at the call site, where a reader can see the decision.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*knowledge-engine/internal/db.Store).Close
    funlen:
      lines: 120
      statements: 80
    goconst:
      min-len: 3
      min-occurrences: 4
    gocyclo:
      # 16, not 13. Four functions sit at 14–16 and every branch in them is a rule the
      # tests name one by one: SafePath (what a document path may be), SplitMarkdown
      # (how a document is cut), Engine.Answer (the cache/retrieve/stream path).
      # Splitting them would move the branches, not remove them.
      min-complexity: 16
    gosec:
      excludes:
        # G706 log injection: the only sink is a human reading `journalctl`. There is no
        # log pipeline to poison, and a newline in a file name is not a threat model.
        - G706
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    # An exclusion that stops matching is dead config that still reads as a decision —
    # the same lie rule 24 calls a suppressed finding. This prints the rule, by name,
    # the run after the path it names goes away. It *warns* rather than failing, so read
    # the output: `make lint` turns a warning into a non-zero exit (see the Makefile).
    warn-unused: true
    rules:
      # A test's branches are its assertions, and its literals read better in place than
      # behind a name declared thirty lines up.
      - path: _test\.go
        linters: [gocyclo, goconst, funlen]
      # G304 "file inclusion via variable" is the job description of an ingest CLI and
      # of config.Load reading .env. The path validation that does matter lives in
      # rag.SafePath and is tested there.
      - path: (cmd/ingest/|internal/config/)
        linters: [gosec]
        text: "G304|G703"
      # Tests read fixtures they just wrote, in a t.TempDir().
      - path: _test\.go
        linters: [gosec]
        text: "G304|G104"

formatters:
  # This is what makes `gofmt -l` a second copy of a check rather than a check: a
  # formatter listed here is reported by `golangci-lint run`, so `make check` runs it
  # once, over the spelled-out packages, and not over web/ui/node_modules.
  enable:
    - gofmt
  # gofumpt is *not* here and needs no `disable:` — formatters are opt-in, so listing it
  # would disable nothing. The reason it stays out: it classifies an import path whose
  # first segment has no dot as stdlib, and this module is named `knowledge-engine`, so it
  # merged every internal import into the std group — exactly backwards from how this repo
  # reads. gofmt alone keeps the two groups apart. (Renaming the module to its repository
  # URL would fix the heuristic *and* the stale product name; it rewrites the import line
  # of every file, so it is a decision of its own, not a formatting side effect.)
