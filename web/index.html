<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- viewport-fit=cover makes env(safe-area-inset-*) non-zero, so the fixed prompt
     can clear the iOS home indicator; interactive-widget=resizes-content lets the
     on-screen keyboard shrink the layout instead of covering it (Android/Chrome —
     iOS is handled from visualViewport below). Pinch-zoom stays enabled: no
     maximum-scale / user-scalable=no, per WCAG 1.4.4. -->
<meta name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#0a0a24" />
<meta name="color-scheme" content="dark" />
<title>Knowledge Engine</title>

<!-- ══ Front-end assets ═══════════════════════════════════════════════════════
     Every asset URL below starts with ASSET_BASE (see internal/config), which
     Go substitutes at startup: jsDelivr by default, or "/vendor" after
     `make vendor` to serve every byte from the binary itself (air-gapped
     installs). The vendor tree mirrors the npm layout, so these paths — and the
     integrity digests — hold either way.

     Every version is pinned *exactly*: a pinned jsDelivr URL is immutable and
     cached for a year, and a floating spec is how this page previously broke —
     `npm/marked/marked.min.js` was dropped from the package after marked v4, so
     the unpinned URL started 404ing and answers silently stopped rendering.
     To upgrade, bump the version AND its digest (both come from the tarball;
     `make vendor` re-verifies them). 8-BIT NES publishes its own at /sri.json.
     ═══════════════════════════════════════════════════════════════════════ -->
<%if .Remote%><link rel="preconnect" href="<%.Origin%>" crossorigin>
<%end%>
<!-- 8-BIT NES design system 0.5.0. All three faces are used on first paint, and
     each href is the exact URL all.min.css resolves url() to — so preloading
     starts them alongside the stylesheet instead of after it, and each file is
     still fetched exactly once. (No integrity on these: a font pulled in by
     url() carries no integrity metadata, so a mismatch would cost a 2nd fetch.) -->
<link rel="preload" as="font" type="font/woff2" crossorigin
  href="<%.Base%>/8bit-nes@0.5.0/fonts/nes-sans-var.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin
  href="<%.Base%>/8bit-nes@0.5.0/fonts/nes-mono-400.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin
  href="<%.Base%>/8bit-nes@0.5.0/fonts/nes-mono-700.woff2">
<link rel="stylesheet" href="<%.Base%>/8bit-nes@0.5.0/all.min.css"
  integrity="sha384-HCXNMGpoqEivRE++SgiAw7C3sCDES+TbYEf4pVJV/dRV/41rXmAIxix0NmKRLKCV"
  crossorigin="anonymous">
<script type="module" src="<%.Base%>/8bit-nes@0.5.0/elements.min.js"
  integrity="sha384-R8iVNERudea0ShszwfLSyCOlY0Erja6/RkdJneCVwyOjk4pSnGE+pXkzLJWDU1PS"
  crossorigin="anonymous"></script>

<!-- App runtime. `defer` keeps ~240 kB of parser-blocking <script> out of the
     critical path; deferred scripts still run in order, before DOMContentLoaded,
     which is where the app boots (bottom of <body>).
     Vue 3.5 global build — the isCustomElement API used below is unchanged in 3.6. -->
<script defer src="<%.Base%>/vue@3.5.40/dist/vue.global.prod.js"
  integrity="sha384-yjSqnKX+01fhYzLUMRlCkMrHMTdKxwYcGIk5HZ6ug+4nfJn10+F7YsKRuGR5kQac"
  crossorigin="anonymous"></script>
<script defer src="<%.Base%>/marked@18.0.7/lib/marked.umd.js"
  integrity="sha384-7njNzKcJUBdezPGfqUrIFizi2QkXJH0M6wF3o1h9GE/nce6X4YdecMwh31B19yTi"
  crossorigin="anonymous"></script>
<script defer src="<%.Base%>/dompurify@3.4.12/dist/purify.min.js"
  integrity="sha384-piCcpDdJ7qVeK4Tv8Z6Hpcr3ZBIgP16TxQTPVfsLFdZ5uDgwc3Y8Ho7oUnqf12qu"
  crossorigin="anonymous"></script>

<!-- App shell: layout-only CSS (web/app/styles.css) and the conversation module
     (web/app/app.js → chat.js · answer.js · viewport.js). Native ES modules, so
     there is still no build step — the Go binary serves them from its embed FS. -->
<link rel="stylesheet" href="/app/styles.css">
<!-- the whole module graph, declared up front: without the three leaves listed
     here they'd only be discovered once app.js has been fetched and parsed, which
     costs a second round trip on a phone -->
<link rel="modulepreload" href="/app/app.js">
<link rel="modulepreload" href="/app/chat.js">
<link rel="modulepreload" href="/app/answer.js">
<link rel="modulepreload" href="/app/viewport.js">
</head>
<body>
<!-- No .scanlines wrapper: its ::after is a fixed, full-viewport striped layer over
     everything, and DESIGN.md is explicit that reading text sits on a *solid*
     ground, never a scanline layer. The CRT read comes from the chrome instead. -->
<div id="app">
  <header class="bar">
    <!-- the light tracks /api/health, so it means something -->
    <span class="badge clear" :data-accent="online ? 'good' : 'crit'"
      :aria-label="online ? 'Server online' : 'Server unreachable'">●</span>
    <span class="eyebrow">Knowledge Engine</span>
    <button class="btn ghost icon sm grow" v-if="turns.length" @click="reset"
      aria-label="New question"><nes-icon name="plus"></nes-icon></button>
  </header>

  <main>
    <!-- .empty ships the dashed panel + centred mono copy; the library's guidance
         is "always an action out", which on a phone means tappable starters. -->
    <div class="empty" v-if="!turns.length">
      <span class="icon">◈</span>
      <span class="title">Ask the source of truth</span>
      <p>Grounded answers from approved docs — every claim cited.</p>
      <div class="suggest">
        <button class="suggest-item" v-for="s in starters" :key="s" @click="ask(s)">
          {{ s }} <nes-icon name="arrowRight"></nes-icon>
        </button>
      </div>
    </div>

    <article class="turn" v-for="t in turns" :key="t.id">
      <h2 class="q">{{ t.q }}</h2>

      <div class="callout gotcha" v-if="t.error" role="alert">
        <b>Request failed</b> — {{ t.error }}
      </div>

      <div class="a card" data-accent="blue" v-else :aria-busy="t.streaming ? 'true' : null">
        <div class="head">
          <span class="title">Answer</span>
          <span class="spinner sm" v-if="t.streaming" aria-label="Generating"></span>
        </div>

        <div class="prose" v-html="answerHtml(t)"></div>

        <!-- official grounded-answer recipe: .sources rows that the inline .cite
             markers in the prose above link down to -->
        <ol class="sources" v-if="t.citations.length">
          <li class="source" v-for="c in t.citations" :key="c.n" :id="srcId(t, c.n)">
            <span class="source-n">{{ c.n }}</span>
            <span class="source-title" :title="c.doc">{{ short(c.doc) }}</span>
            <span class="source-host" v-if="c.heading">{{ c.heading }}</span>
          </li>
        </ol>

        <div class="feedback" v-if="!t.streaming && t.a">
          <div class="feedback-actions">
            <button class="btn ghost xs icon" @click="copy(t)" aria-label="Copy answer">
              <nes-icon name="copy"></nes-icon></button>
            <button class="btn ghost xs icon" @click="regenerate(t)" aria-label="Regenerate answer">
              <nes-icon name="refresh"></nes-icon></button>
          </div>
          <div class="feedback-meta">
            <span v-if="t.citations.length">{{ t.citations.length }} SRC</span>
            <span v-if="t.ms">{{ t.ms }} MS</span>
          </div>
        </div>
      </div>
    </article>
  </main>

  <div class="dock" ref="dock">
    <!-- <nes-chat-prompt> is the library's prompt element: it owns the growing
         textarea, Enter-to-send, and the send/stop button (busy → red ■). The app
         only listens for nes:submit / nes:stop, so none of that is reimplemented. -->
    <!-- `busy` reaches it as an attribute via a watcher, not :busy — see app.js. -->
    <nes-chat-prompt ref="prompt"
      placeholder="Ask about the system…" aria-label="Question"
      @nes:submit="ask($event.detail.value)" @nes:stop="stop"></nes-chat-prompt>
  </div>
</div>

<!-- type="module" is what makes the `defer` above safe: module scripts and deferred
     classic scripts run in document order, so Vue / marked / DOMPurify are always
     defined by the time this runs. (A plain inline <script> would run first.)

     This is the only file that names the CDN — boot() receives the design-system
     helpers rather than importing them, so the pinned, integrity-checked URL isn't
     duplicated across the app modules. -->
<script type="module">
  import { toast, setMute } from "<%.Base%>/8bit-nes@0.5.0/elements.min.js";
  import { boot } from "/app/app.js";

  boot({ toast, setMute });
</script>
</body>
</html>
