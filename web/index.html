<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knowledge Engine</title>

<!-- Vue: latest stable 3.x (currently 3.5.x; auto-adopts 3.6 at GA). isCustomElement API is identical. -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<!-- 8-BIT NES design system v0.4.1 (pinned) — one CSS + one elements import at entry (official) -->
<link rel="preload" as="font" type="font/woff2" crossorigin
  href="https://cdn.jsdelivr.net/npm/8bit-nes@0.4.1/fonts/nes-mono-400.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin
  href="https://cdn.jsdelivr.net/npm/8bit-nes@0.4.1/fonts/nes-sans-var.woff2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/8bit-nes@0.4.1/all.min.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/8bit-nes@0.4.1/elements.min.js"></script>

<style>
  /* App LAYOUT only — every value flows from an 8bit-nes token (tokens.css).
     Reset/colors/fonts come from base.css; visual recipes from components.css. */
  #app { min-block-size: 100dvh; }

  header {
    position: sticky; top: 0; z-index: var(--z-overlay);
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-3) var(--sp-4);
    background: var(--bg);
    border-block-end: var(--bw-2) solid var(--line);
  }

  main {
    max-inline-size: 760px; margin-inline: auto;
    padding: var(--sp-5) var(--sp-4) calc(var(--sp-7) * 3);
  }

  .empty { margin-block-start: 12vh; }
  .turn { margin-block-end: var(--sp-6); }

  /* the user's question — gold left-classifier bar, mirrors the .card accent bar */
  .q {
    border-inline-start: var(--accent-bar) solid var(--gold);
    padding-inline-start: var(--sp-3);
    color: var(--ink); font-weight: 700;
    margin-block-end: var(--sp-3);
  }

  .a .head { justify-content: space-between; }

  /* code blocks in a streamed answer: base.css styles inline code only, not blocks */
  .prose pre {
    background: var(--slot);
    border: var(--bw-2) solid var(--line);
    box-shadow: var(--sh-2);
    padding: var(--sp-3) var(--sp-4);
    overflow-x: auto;
    font-size: var(--fs-chip);
    line-height: var(--lh-body);
  }
  .prose pre code { color: var(--text); background: none; border: 0; padding: 0; font-size: inherit; }

  .sources {
    margin-block-start: var(--sp-4);
    padding-block-start: var(--sp-3);
    border-block-start: var(--bw-2) dashed var(--line-hi);
    display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center;
  }

  .composer {
    position: fixed; inset-block-end: 0; inset-inline: 0;
    padding: var(--sp-5) var(--sp-4) var(--sp-4);
    background: linear-gradient(transparent, var(--screen) 30%);
  }
  .composer-bar {
    max-inline-size: 760px; margin-inline: auto;
    display: flex; gap: var(--sp-3); align-items: flex-end;
    background: var(--panel);
    border: var(--bw) solid var(--line-hi);
    box-shadow: var(--sh-4);
    padding: var(--sp-3);
  }
  /* the composer field is a bare textarea inside the panel — the panel is the frame */
  .composer-bar .textarea {
    min-block-size: var(--ctrl-h); max-block-size: 40vh; resize: none;
    border: 0; box-shadow: none; background: transparent; padding: var(--sp-2);
  }
  .composer-bar .textarea:focus-visible { outline: 0; }
  .composer-bar .btn { flex: none; }
</style>
</head>
<body>
<div id="app" class="scanlines">
  <header>
    <span class="badge clear" aria-label="online">●</span>
    <span class="eyebrow">Knowledge Engine</span>
  </header>

  <main>
    <div class="empty" v-if="!turns.length">
      <span class="icon">◈</span>
      <span class="title">Ask the source of truth</span>
      <p>Grounded answers from approved docs — every claim cited.</p>
    </div>

    <div class="turn" v-for="(t, i) in turns" :key="i">
      <div class="q">{{ t.q }}</div>

      <div class="callout gotcha" v-if="t.error">{{ t.error }}</div>

      <div class="a card" data-accent="blue" v-else>
        <div class="head">
          <span class="title">Answer</span>
          <span class="spinner sm" v-if="t.streaming" aria-label="Generating"></span>
        </div>
        <div class="prose" v-html="render(t.a)"></div>
        <div class="sources" v-if="t.citations.length">
          <span class="eyebrow">Sources</span>
          <span class="badge" v-for="c in t.citations" :key="c.n">
            [{{ c.n }}] {{ short(c.doc) }} · {{ c.heading || '—' }}
          </span>
        </div>
      </div>
    </div>
  </main>

  <div class="composer">
    <form class="composer-bar" @submit.prevent="ask">
      <textarea
        class="textarea" ref="input" v-model="draft" rows="1"
        placeholder="Ask about the system…" aria-label="Question"
        @input="autosize" @keydown.enter.exact.prevent="ask"></textarea>
      <button class="btn" type="submit" :disabled="busy || !draft.trim()"
        :aria-busy="busy ? 'true' : null">Ask</button>
    </form>
  </div>
</div>

<script>
const { createApp } = Vue;
marked.setOptions({ breaks: true });

const app = createApp({
  data: () => ({ draft: "", turns: [], busy: false }),
  methods: {
    render(md) { return DOMPurify.sanitize(marked.parse(md || "")); },
    short(p) { return (p || "").split("/").pop(); },
    autosize(e) { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; },
    scroll() { this.$nextTick(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" })); },

    async ask() {
      const q = this.draft.trim();
      if (!q || this.busy) return;
      this.draft = ""; this.$refs.input.style.height = "auto";
      const turn = { q, a: "", citations: [], streaming: true, error: "" };
      this.turns.push(turn); this.busy = true; this.scroll();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q }),
        });
        if (!res.ok) throw new Error("Server error " + res.status);

        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const blocks = buf.split("\n\n");
          buf = blocks.pop();
          for (const b of blocks) this.handleEvent(b, turn);
        }
      } catch (e) {
        turn.error = e.message;
      } finally {
        turn.streaming = false; this.busy = false;
      }
    },

    handleEvent(block, turn) {
      let event = "message", data = "";
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      if (!data) return;
      let payload; try { payload = JSON.parse(data); } catch { return; }
      if (event === "token") { turn.a += payload.t; this.scroll(); }
      else if (event === "citations") { turn.citations = payload; }
      else if (event === "error") { turn.error = payload.message; }
    },
  },
});

// Official Vue setup for light-DOM web components in the in-browser (global build)
// compiler: skip component resolution for <nes-*> tags. Must run BEFORE mount.
app.config.compilerOptions.isCustomElement = (t) => t.startsWith("nes-");
app.mount("#app");
</script>
</body>
</html>
