name: Deploy guide

# Publishes the bilingual guide to GitHub Pages, so the team can read setup and
# deploy instructions without anything running — including before the server
# exists, and while it's down. Two pages, each with its own URL:
#
#   index.html   the Guide  (web/docs.html)
#   deploy.html  the Deploy runbook (web/deploy.html)
#
# One-time setup, by a human with admin on the repo (a workflow token cannot do it):
#   Settings → Pages → Source: GitHub Actions
# Until that is done every run fails at configure-pages with "Get Pages site failed".
#
# Both are Go templates (versions and SRI digests come from web/vendor.sha384),
# so they are rendered by cmd/rendocs rather than copied. That keeps the
# published pages generated from the same source the binary serves — there is no
# second copy to drift.

on:
  push:
    branches: [main]
    paths:
      - web/docs.html
      - web/deploy.html
      - web/docsbase.html
      - web/vendor.sha384
      - web/embed.go
      - web/assets.go
      - cmd/rendocs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      # rendocs imports only the web package — no cgo, no SQLite, no API key.
      - name: Render the guide
        run: |
          go run ./cmd/rendocs -d _site
          # Both pages must exist: a grep over an empty _site would pass happily
          # and publish nothing.
          test -s _site/index.html && test -s _site/deploy.html
          # Fail loudly if a template action survived into either page.
          ! grep -rq '<%' _site/
          # Each page must link the other, or the split leaves a dead end.
          grep -q 'deploy.html' _site/index.html
          grep -q 'index.html' _site/deploy.html

      # No `enablement: true` here — it was tried and cannot work. Creating a Pages
      # site needs repo-admin rights, and GITHUB_TOKEN tops out at `pages: write`,
      # which only deploys to a site that already exists. The attempt fails with
      # "Create Pages site failed … Resource not accessible by integration", so the
      # one-time toggle in Settings genuinely has to be done by a person.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
