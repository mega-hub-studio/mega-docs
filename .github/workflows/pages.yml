name: Deploy guide

# Publishes the bilingual guide (web/docs.html) to GitHub Pages, so the team can
# read setup and deploy instructions without anything running — including before
# the server exists, and while it's down.
#
# One-time setup: repo Settings → Pages → Source: GitHub Actions.
#
# The page is a Go template (versions and SRI digests come from
# web/vendor.sha384), so it is rendered by cmd/rendocs rather than copied. That
# keeps the published page generated from the same source the binary serves —
# there is no second copy to drift.

on:
  push:
    branches: [main]
    paths:
      - web/docs.html
      - web/deploy.html
      - web/docsbase.html
      - web/vendor.sha384
      - web/embed.go
      - web/assets.go
      - cmd/rendocs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      # rendocs imports only the web package — no cgo, no SQLite, no API key.
      - name: Render the guide
        run: |
          go run ./cmd/rendocs -d _site
          # Fail loudly if a template action survived into either page.
          ! grep -rq '<%' _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
