name: Deploy guide

# Publishes the bilingual guide to GitHub Pages, so the team can read setup and
# deploy instructions without anything running — including before the server
# exists, and while it's down. Two pages, each with its own URL:
#
#   index.html   the Guide  (web/docs.html)
#   deploy.html  the Deploy runbook (web/deploy.html)
#
# No manual setup: the configure-pages step below enables Pages on its first run.
#
# Both are Go templates (versions and SRI digests come from web/vendor.sha384),
# so they are rendered by cmd/rendocs rather than copied. That keeps the
# published pages generated from the same source the binary serves — there is no
# second copy to drift.

on:
  push:
    branches: [main]
    paths:
      - web/docs.html
      - web/deploy.html
      - web/docsbase.html
      - web/vendor.sha384
      - web/embed.go
      - web/assets.go
      - cmd/rendocs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      # rendocs imports only the web package — no cgo, no SQLite, no API key.
      - name: Render the guide
        run: |
          go run ./cmd/rendocs -d _site
          # Both pages must exist: a grep over an empty _site would pass happily
          # and publish nothing.
          test -s _site/index.html && test -s _site/deploy.html
          # Fail loudly if a template action survived into either page.
          ! grep -rq '<%' _site/
          # Each page must link the other, or the split leaves a dead end.
          grep -q 'deploy.html' _site/index.html
          grep -q 'index.html' _site/deploy.html

      # enablement: true turns Pages on via the API on the first run, so the site
      # does not depend on someone having clicked Settings → Pages → GitHub Actions.
      # Without it the first run dies at "Get Pages site failed … Not Found".
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
