name: Deploy guide

# Publishes the bilingual guide to GitHub Pages, so the team can read setup and
# deploy instructions without anything running — including before the server
# exists, and while it's down. One page per role, each with its own URL:
#
#   index.html   the Guide  (web/docs.html)   — everyone, then BA
#   dev.html     the Dev page (web/dev.html)  — DEV
#   deploy.html  the Deploy runbook (web/deploy.html)
#   llms.txt     the llmstxt.org index for AI agents — generated from the pages
#   spec.json    the machine-readable spec: every feature with the routes, environment
#                variables and tests behind it — also generated from the pages
#
# One-time setup, by a human with admin on the repo (a workflow token cannot do it):
#   Settings → Pages → Source: GitHub Actions
# Until that is done every run fails at configure-pages with "Get Pages site failed".
#
# All are Go templates (versions and SRI digests come from web/vendor.sha384),
# so they are rendered by cmd/rendocs rather than copied. That keeps the
# published pages generated from the same source the binary serves — there is no
# second copy to drift.

on:
  push:
    branches: [main]
    paths:
      - web/docs.html
      - web/ba.html
      - web/dev.html
      - web/deploy.html
      - web/llms.go
      - web/spec.go
      - web/docsbase.html
      - web/vendor.sha384
      - web/embed.go
      - web/assets.go
      - cmd/rendocs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      # rendocs imports only the web package — no cgo, no SQLite, no API key.
      - name: Render the guide
        run: |
          go run ./cmd/rendocs -d _site
          # Every page must exist: a grep over an empty _site would pass happily
          # and publish nothing.
          for f in index.html ba.html dev.html deploy.html llms.txt spec.json; do test -s "_site/$f"; done
          # Fail loudly if a template action survived into either page.
          ! grep -rq '<%' _site/
          # Each page must link the other two, or a role lands in a dead end.
          for f in index.html ba.html dev.html deploy.html; do
            grep -q 'index.html'  "_site/$f"
            grep -q 'ba.html'     "_site/$f"
            grep -q 'dev.html'    "_site/$f"
            grep -q 'deploy.html' "_site/$f"
          done
          # llms.txt is what an agent reads first: it must link every page, and it
          # must be plain text (it is derived from HTML, so a leaked tag is possible).
          for f in index.html ba.html dev.html deploy.html; do grep -q "$f" _site/llms.txt; done
          ! grep -q '<' _site/llms.txt
          # spec.json is what an agent harness reads to place a change. It must be valid
          # JSON (it is assembled from parsed markup, so a stray quote is possible) and it
          # must link llms.txt's pages, not some other site.
          python3 -c "import json; d=json.load(open('_site/spec.json')); \
            assert len(d['features'])>=15, len(d['features']); \
            assert all(f['url'].startswith('https://mega-hub-studio.github.io/mega-docs/') for f in d['features'])"
          grep -q 'spec.json' _site/llms.txt

      # No `enablement: true` here — it was tried and cannot work. Creating a Pages
      # site needs repo-admin rights, and GITHUB_TOKEN tops out at `pages: write`,
      # which only deploys to a site that already exists. The attempt fails with
      # "Create Pages site failed … Resource not accessible by integration", so the
      # one-time toggle in Settings genuinely has to be done by a person.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
