name: check

# `make check` on every push and pull request — the same gate a human runs before
# deploying, in the one place nobody can skip. Two jobs: the gate on Linux, and the
# cgo layer built and exercised on darwin, because a deploy host can be either.
#
# Why this exists: until now the tests only ran on a laptop and on the deploy host,
# so a broken commit reached `main` looking fine and failed at `make check` *during*
# a deployment — after the pull, with the service already stopped. The invariants
# worth protecting are the ones that fail silently (a scope that stops filtering, a
# cache that answers one folder from another), and those are exactly the ones nobody
# re-tests by hand.
#
# The build needs cgo: sqlite-vec and FTS5 are C. ubuntu-latest ships gcc, so the
# Makefile's own TAGS and CGO_ENABLED=1 are all that is required — no apt install.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # web/vendor/ is gitignored (the assets are fetched, never committed), and one
      # test asserts the tree matches every pin in web/vendor.sha384. Without this
      # step that test fails on a fresh checkout for a reason that has nothing to do
      # with the change being tested.
      - name: Vendor the pinned front-end assets
        run: make vendor

      # The app's front end is a Vite project whose build output is committed. Node is
      # here for two reasons: `make check` runs ESLint over web/ui (that is where the
      # "a template binds nothing undefined" rule lives now), and the step after it
      # rebuilds the bundle to prove the committed one is what the sources produce.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install the front end
        run: npm ci --no-audit --no-fund
        working-directory: web/ui

      # No linter and no deadcode step here: `make lint` installs the version pinned in the
      # Makefile itself (GOLANGCI_VERSION) and `make dead` installs deadcode, so each tool
      # has one installer for this repo instead of a copy here that can drift from the one a
      # laptop has. That drift is not hypothetical: this workflow used to run `@latest` for
      # the linter while developers had whatever they installed once, and the gate went
      # green locally and red here on `goconst` and a new `gosec` rule. deadcode drifted the
      # other way — installed here, skipped on a laptop, which reads exactly like a pass.
      - name: make check
        run: make check

      # TestBuiltUIMatchesItsSources already fails when web/dist is stale — it compares a
      # hash of web/ui recorded at build time. This is the other direction: rebuild from
      # the same lockfile and prove the committed output is byte-identical, so a bundle
      # cannot carry anything its sources do not produce.
      - name: The committed bundle is what the sources build
        run: |
          make ui
          git diff --exit-code --stat web/dist || {
            echo "::error::web/dist differs from a fresh build of web/ui — commit the rebuild";
            exit 1;
          }

      # The gate proves the code is correct; this proves it still builds into the two
      # binaries a deploy actually installs.
      - name: make build
        run: make build

  # The only platform-specific thing in this repo is the cgo layer — sqlite-vec and FTS5 are
  # C — and a deploy host can be macOS now: the Deploy page documents launchd and `make deploy`
  # picks its supervisor from `uname -s`. Until this job existed, "cross-OS self-host" in
  # README.md was one platform plus a claim.
  #
  # Deliberately *not* a matrix over the job above. Lint, ESLint, deadcode, the credential
  # scan and the bundle rebuild are platform-independent, so running them twice doubles the
  # gate and returns no new fact.
  #
  # `make test` and not `make build` alone, because compiling and linking the bindings is not
  # the failure worth catching: sqlite-vec is registered through cgo and internal/db exercises
  # it against a real database, so a darwin difference surfaces at run time or nowhere.
  #
  # No `make vendor` and no Node, because nothing here reads either. That leaves
  # TestVendorTreeMatchesTheManifest skipping with "vendor/ is empty", which is the intent —
  # the vendor tree is identical on every OS and the job above checks it. Read that skip as
  # covered there, not as covered here.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: make test
        run: make test

      - name: make build
        run: make build
